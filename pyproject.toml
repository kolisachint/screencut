[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screencut"
version = "0.1.0"
description = "Raw screen recording in, publish-ready video out. See docs/architecture.md."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
# The repository layout of docs/architecture.md §12 is the package layout.
packages = ["spec", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
