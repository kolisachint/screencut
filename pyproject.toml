[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screencut"
version = "0.1.0"
description = "Raw screen recording in, publish-ready video out. See docs/architecture.md."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cairosvg>=2.7",
]

[project.scripts]
screencut = "runner.cli:main"
screencut-review = "review.app:main"

[project.optional-dependencies]
# The review UI is the one part of this system with a web server in it, and it is
# not needed to render a job. Kept optional so a headless machine installs the
# pipeline without one (decision #2).
review = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
# The repository layout of docs/architecture.md §12 is the package layout.
packages = ["spec", "ingest", "plan", "synth", "prefs", "compile", "runner", "verify", "review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
